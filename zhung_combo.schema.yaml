# Rime schema
# encoding: utf-8

schema:
  schema_id: zhung_combo
  name: 中原話宮保拼音
  version: "4.0"
  author:
    - 佛振 <chen.sst@gmail.com>
  description: |
    宮保拼音七指禪指法
    並擊輸入老派鄭州話
    升級至 streaming_chord 原生串流架構

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
    abbrev: [ 中, Ａ ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - chord_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier

# ==========================================
# 1. 七指禪 20 鍵串流佈局
# ==========================================
streaming_chord:
  initial_keys: XSCZHLFGDBKTP
  final_keys: YIUVANREO
  chord_duration_ms: 60
  chord_timeout_ms: 120
  key_map:
    # --- 左手聲母 12 鍵 ---
    s: S
    w: C
    x: Z
    d: H
    e: L
    c: F
    f: G
    r: D
    v: B
    g: K
    t: T
    b: P
    # --- 右手韻母 8 鍵 ---
    space: A   # 拇指
    j: I       # 食指
    u: U       # 中指
    m: V       # 食指下排 (iu/ü)
    k: N       # 無名指
    i: R       # 中指上排
    l: E       # 小指
    o: O       # 無名指上排
    # --- 空鍵 ---
    q: X
    a: X
    z: X
    y: Y
    h: Y
    n: Y
    p: Y
  canonicalize:
    __include: /zhung_canonicalize

# ==========================================
# 2. 字母表與拼寫代數（中州羅馬字 -> 宮保拼音碼）
# ==========================================
speller:
  alphabet: 'SCZHLFGDBKTPIUVANREOXY[]'
  delimiter: " '"
  algebra:
    __include: /zhung_algebra

# ==========================================
# 3. 翻譯器與回顯
# ==========================================
translator:
  dictionary: zhung
  prism: zhung_combo
  enable_completion: false
  canonicalize:
    __include: /zhung_canonicalize
  preedit_format:
    __include: /zhung_preedit

editor:
  bindings:
    BackSpace: back_syllable
    Return: confirm

ascii_composer:
  bindings:
    "Shift+KP_Enter": commit_raw_input
    "Shift+Return": commit_raw_input
    "Shift+space": commit_raw_input_with_space
  inline_keypad: true
  inline_uppercase: true

recognizer:
  patterns:
    punct: "^/([0-9]0?|[A-Za-z]+)$"

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    - { when: paging, accept: comma, send: comma }
    - { when: has_menu, accept: period, send: period }

# ==========================================
# 規則庫定義
# ==========================================

zhung_canonicalize:
  - xform/[XY]//
  - reorder SCZHLFGDBKTPIUVANREO
  - xform/^[A-Z]+$/[$0]/

zhung_algebra:
  # 1. 聲調剝離（本方案爲無調並擊）
  - derive/^([a-z]+)[1-4]$/$1/
  - 'erase/^.*[0-9]$/'

  # 2. 依據 zhuan_pinyin 規律補全詞典中省略的介音
  # 團音後接 a, e, o 省略的 i
  - xform/^([jqx])([aeo])/$1i$2/
  # 團音後接撮口韻省略的 iu
  - xform/^([jqx])u/$1iu/

  # 3. 零聲母歸併
  - xform/^wu/u/
  - xform/^w([aeo])/u$1/
  - xform/^yi/i/
  - xform/^y([aeou])/i$1/

  # 4. 韻母轉寫
  # 兒化與舌尖元音
  - xform/^el$/R/              # 兒 el = R
  - xform/^([zcs]h?|r)y$/$1R/  # 舌尖元音 y = R (sy->SR, shy->ZFR)

  # 複韻母與鼻音
  - xform/iau$/IAO/
  - xform/au$/AO/
  - xform/iou$/IR/
  - xform/ou$/RO/
  - xform/iai$/IAR/           # 界 iai = IAR
  - xform/ai$/AR/
  - xform/ui$/UR/
  - xform/ei$/RE/
  - derive/uang$/UARO/
  - xform/uang$/UANE/
  - xform/iang$/IANE/
  - xform/ang$/ANE/
  - derive/iung$/IRO/
  - xform/iung$/VNE/
  - derive/ung$/URO/
  - xform/ung$/UNE/
  - xform/ing$/INE/
  - xform/eng$/NE/
  - xform/iuan$/VAN/
  - xform/uan$/UAN/
  - xform/ian$/IAN/
  - xform/an$/AN/
  - xform/iun$/VN/
  - xform/un$/UN/
  - xform/in$/IN/
  - xform/en$/N/

  # 撮口介音 (iu = Ü)
  - derive/iuo$/IO/           # 藥 iuo = IO
  - xform/iuo$/VO/
  - xform/iue$/VE/            # 月 iue = ÜE

  - xform/ue$/UE/             # 國 ue = UE
  - xform/ie$/IE/

  # 基礎單元音
  - xform/^a$/SHGA/           # 區別空格
  - xform/a$/A/
  - xform/eo$/E/              # 各 eo = E
  - xform/e$/AE/              # 革 e = AE
  - xform/o$/O/
  - xform/iu/V/               # 雨/居 iu = Ü
  - xform/u/U/
  - xform/i/I/

  # 5. 聲母轉寫
  - xform/^v/ZFB/             # 未 v = ZFB
  - xform/^gh/SHG/            # 鵝 gh = SHG
  - xform/^zh/ZF/
  - xform/^ch/CL/
  - xform/^sh/SH/
  - xform/^rh/HG/             # 日 rh = HG
  - xform/^m/FB/
  - xform/^n/LD/
  - xlit/bpfdtlgkhjqxzcs/BPFDTLGKHGKHZCS/

  # 6. 單輔音成音節補足
  - derive/^([BPF]|FB)U$/$1/
  - derive/^([DTLGKH]|LD)E$/$1/
  - derive/^([ZCS]|ZF|CL|SH|HG)R$/$1/  # 舌尖元音通常省略

  # 7. 定界閉包
  - xform/^.+$/[$0]/

zhung_preedit:
  - xform/[XY]//
  - reorder SCZHLFGDBKTPIUVANREO
  - xform/\[?([A-Z]+)\]?/$1/
  - xlit/V/Ü/

__patch:
  # 使用八股文語言模型
  - grammar:/hant?
  # 用家自選配置
  - zhung_combo.custom:/patch?
